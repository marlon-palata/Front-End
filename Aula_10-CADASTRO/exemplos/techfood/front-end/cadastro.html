<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
    <title>TechFood - Cadastrar Prato</title>
  </head>
  <body>
    <!-- =====================================================
         CADASTRO DE PRATO — Aula 10
         Página nova. O menu (index.html e pedidos.html) já
         apontava para cá desde a Aula 9 — agora o arquivo existe.

         O formulário envia para POST /produtos (api.js →
         cadastrarProduto). Como há upload de imagem, o cadastro.js
         monta um FormData (texto + arquivo no mesmo envio).

         A TÉCNICA de receber e salvar a imagem é do BACK-END.
         O front só fornece o campo de upload e o botão de enviar.
    ===================================================== -->

    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu">&#9776;</label>

      <nav id="menu" role="navigation" aria-label="Menu principal">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html" class="ativo">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="secao-cadastro">
        <h2 class="titulo-secao">&#127859; Cadastrar Novo Prato</h2>

        <!-- =====================================================
             FORMULÁRIO DE CADASTRO
             Cada campo tem um id que o cadastro.js vai ler.
             enctype="multipart/form-data" — necessário em formulários
             com upload de arquivo (mesmo que o envio real seja via JS).
        ===================================================== -->
        <form id="form-cadastro" class="form-cadastro" enctype="multipart/form-data">
          <!-- Nome do prato -->
          <div class="campo">
            <label for="nome">Nome do prato *</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex: Lasanha à Bolonhesa"
              maxlength="60"
              required
            />
          </div>

          <!-- Descrição -->
          <div class="campo">
            <label for="descricao">Descrição *</label>
            <textarea
              id="descricao"
              name="descricao"
              placeholder="Ex: Massa fresca com molho de tomate e carne moída"
              maxlength="200"
              rows="3"
              required
            ></textarea>
          </div>

          <!-- Preço -->
          <div class="campo">
            <label for="preco">Preço (R$) *</label>
            <input
              type="number"
              id="preco"
              name="preco"
              placeholder="Ex: 42.00"
              step="0.01"
              min="0"
              required
            />
          </div>

          <!-- Categoria -->
          <div class="campo">
            <label for="categoria">Categoria *</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="entrada">Entrada</option>
              <option value="massa">Massa</option>
              <option value="prato-principal">Prato Principal</option>
              <option value="sobremesa">Sobremesa</option>
              <option value="bebida">Bebida</option>
            </select>
          </div>

          <!-- Upload de imagem — o FRONT só fornece o botão.
               O back-end de cada aluno decide como receber e salvar. -->
          <div class="campo">
            <label for="imagem">Foto do prato</label>
            <input
              type="file"
              id="imagem"
              name="imagem"
              accept="image/*"
            />
            <small class="dica-campo">Formatos: JPG, PNG. Opcional.</small>
          </div>

          <!-- Botão enviar -->
          <button type="submit" id="btn-cadastrar" class="btn-cadastrar">
            Cadastrar Prato
          </button>

          <!-- Área de feedback (sucesso ou erro) — cadastro.js preenche -->
          <p id="feedback-cadastro" class="feedback-cadastro"></p>
        </form>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <!--
      Ordem dos scripts — importante:
      1. global.js  → funções compartilhadas (saudação, modal, data)
      2. api.js     → funções de fetch (cadastro.js depende de cadastrarProduto)
      3. cadastro.js → lógica do formulário de cadastro
    -->
    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/cadastro.js"></script>
  </body>
</html>
